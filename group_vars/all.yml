---
homebrew_prefix: "{{ '/opt/homebrew' if ansible_architecture == 'arm64' else '/usr/local' }}"

# Optional installation profiles. The baseline Brewfile is always applied.
install_app_store_apps: false
install_optional_apps: false
install_virtualization_apps: false
install_rosetta_apps: false

# Rosetta is intentionally never installed automatically. If this is enabled,
# the playbook verifies that Rosetta is already present before continuing.
require_rosetta_for_rosetta_apps: true

powershell_modules:
  - ExchangeOnlineManagement
  - Microsoft.Graph
  - Microsoft.Graph.Beta

vscode_path: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
vscode_extensions:
  - docker.docker
  - esbenp.prettier-vscode
  - github.vscode-pull-request-github
  - google.geminicodeassist
  - googlecloudtools.cloudcode
  - hashicorp.terraform
  - ms-azuretools.vscode-containers
  - ms-azuretools.vscode-docker
  - ms-python.debugpy
  - ms-python.isort
  - ms-python.python
  - ms-python.vscode-pylance
  - ms-python.vscode-python-envs
  - ms-toolsai.jupyter
  - ms-vscode-remote.remote-containers
  - ms-vscode-remote.remote-ssh
  - ms-vscode.cmake-tools
  - ms-vscode.cpptools-extension-pack
  - ms-vscode.powershell
  - openai.chatgpt
  - platformio.platformio-ide
  - redhat.ansible
  - redhat.vscode-xml
