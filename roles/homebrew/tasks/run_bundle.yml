---
- name: "Check {{ brewfile_name }}"
  ansible.builtin.command:
    argv:
      - "{{ homebrew_prefix }}/bin/brew"
      - bundle
      - check
      - "--file={{ playbook_dir }}/{{ brewfile_name }}"
  register: brew_bundle_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Install {{ brewfile_name }}"
  ansible.builtin.command:
    argv:
      - "{{ homebrew_prefix }}/bin/brew"
      - bundle
      - install
      - "--file={{ playbook_dir }}/{{ brewfile_name }}"
      - --no-upgrade
  when:
    - brew_bundle_check.rc != 0
    - not ansible_check_mode
  changed_when: true
