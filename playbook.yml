---
- name: Configure this Mac
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Explain legacy migration status
      ansible.builtin.debug:
        msg: >-
          The legacy setup role is disabled. Run scripts/inventory-mac.sh on
          the current Mac, review its output, and then migrate approved items.
      when: not (run_legacy_setup | bool)
      tags:
        - always

  roles:
    - role: setup
      when: run_legacy_setup | bool
      tags:
        - legacy
